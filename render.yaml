services:
  - type: web
    name: cooking-recipe-api
    runtime: docker
    rootDir: CookingRecipe
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Spoonacular__ApiKey
        sync: false
      - key: YouTube__ApiKey
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: ConnectionStrings__Redis
        sync: false
